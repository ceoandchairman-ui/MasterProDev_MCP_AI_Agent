global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: mpd-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api.railway.internal:8000"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector.railway.internal:8889"]
