[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/dockerfiles/api.Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Keep at 1 until a staging run with two replicas passes against real Postgres and Redis (see docs/ARCHITECTURE.md).
numReplicas = 1
