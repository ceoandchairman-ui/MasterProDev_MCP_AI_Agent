[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/dockerfiles/api.Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
# Keep at 1 until a two-replica test passes against the production Postgres and Redis (see docs/ARCHITECTURE.md).
numReplicas = 1
