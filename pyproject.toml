[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpd-assistant"
version = "0.1.0"
description = "MasterProDev Multi-Agent AI Assistant with LangGraph, PostgreSQL sessions, and comprehensive observability"
requires-python = ">=3.11"
authors = [
    {name = "MasterProDev", email = "dev@masterprodev.com"}
]
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    # Core LLM and agents
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.0.1",

    # Web framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "starlette>=0.36.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",

    # Database and caching
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.0",

    # Search and retrieval
    "weaviate-client>=3.25.0",
    "sentence-transformers>=2.2.0",

    # LLM providers
    "huggingface-hub>=0.17.0",
    "anthropic>=0.7.0",
    "boto3>=1.28.0",

    # Observability
    "opentelemetry-api>=1.21.0",
    "opentelemetry-sdk>=1.21.0",
    "opentelemetry-exporter-otlp>=0.42b0",
    "opentelemetry-instrumentation-fastapi>=0.42b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
    "opentelemetry-instrumentation-redis>=0.42b0",
    "opentelemetry-instrumentation-httpx>=0.42b0",
    "langsmith>=0.1.0",
    "prometheus-client>=0.18.0",

    # PII and privacy
    "presidio-analyzer>=0.2.2",
    "presidio-anonymizer>=0.2.2",
    "cryptography>=41.0.0",
    "phonenumbers>=8.13.0",

    # Multimodal
    "python-multipart>=0.0.6",
    "pydub>=0.25.0",
    "pillow>=10.0.0",
    "pypdf>=3.17.0",
    "python-docx>=0.8.11",

    # Utilities
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "tenacity>=8.2.0",
    "pybreaker>=1.4.0",
    "pydantic-extra-types>=2.0.0",
    "libphonenumber-for-python>=8.13.0",
]

optional-dependencies = {
    dev = [
        "pytest>=7.4.0",
        "pytest-asyncio>=0.21.0",
        "pytest-cov>=4.1.0",
        "black>=23.10.0",
        "ruff>=0.11.0",
        "mypy>=1.6.0",
        "types-redis>=4.6.0",
        "types-requests>=2.31.0",
    ],
    eval = [
        "ragas>=0.1.0",
        "datasets>=2.14.0",
    ]
}

[tool.setuptools]
packages = ["mpd_assistant"]

[tool.setuptools.package-data]
mpd_assistant = ["py.typed"]

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]  # Line too long (handled by black)

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=mpd_assistant --cov-report=html --cov-report=term-missing"

[tool.coverage.run]
source = ["mpd_assistant"]
omit = ["*/tests/*", "*/__init__.py"]
