[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpd-assistant"
version = "0.1.0"
description = "MasterProDev multi-agent conversational assistant (LangGraph, Postgres sessions, OpenTelemetry)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "python-jose>=3.3",
    "bcrypt>=4.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tenacity>=8.2.3",
    "pybreaker>=1.1",
    "cryptography>=42",
    "phonenumbers>=8.13",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis>=5.0.1",
    "langgraph>=0.2",
    "langchain-core>=0.2.3",
    "weaviate-client>=4.5.4",
    "presidio-analyzer",
    "presidio-anonymizer",
    "prometheus-client>=0.19",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
]
eval = [
    "ragas",
    "datasets",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mpd_assistant = ["**/*.yaml"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
